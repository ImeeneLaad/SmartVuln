rules:
  - id: smartvuln-weak-password-hash
    message: >-
      Fast, unsalted digest ($ALG) used where credentials/secrets may be hashed. MD5/SHA-1 password hashes
      are cracked with rainbow tables or GPUs in seconds.
    severity: WARNING
    languages: [typescript, javascript]
    metadata:
      cwe: ["CWE-916: Use of Password Hash With Insufficient Computational Effort"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
      likelihood: MEDIUM
      smartvuln_category: weak-crypto
      remediation: Use a slow, salted password hash (bcrypt, scrypt, argon2) for credentials.
    patterns:
      - pattern: $CRYPTO.createHash("$ALG")
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^(md5|md4|sha1|sha-1)$
